name: aiid-experts

services:
  db:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiid}
      POSTGRES_USER: ${POSTGRES_USER:-aiid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set a local password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [database]

  backend:
    image: aiid-experts-backend:dev
    pull_policy: never
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-aiid}
      POSTGRES_USER: ${POSTGRES_USER:-aiid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      start_period: 20s
      interval: 5s
      timeout: 4s
      retries: 12
    networks: [database, web]

volumes:
  postgres-data:

networks:
  database:
    internal: true
  web:
    driver: bridge
